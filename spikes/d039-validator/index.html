<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cognexus D039 Validator Spike</title>
<style>body{font-family:monospace;white-space:pre-wrap;padding:16px} .ok{color:green}.err{color:red}</style>
</head>
<body>
<h1>Cognexus D039 Validator Spike</h1>
<pre id="out">Loading...</pre>
<script type="module">
const out=document.getElementById("out");
const lines=[];
const log=(label,value)=>lines.push(label+": "+(typeof value==="string"?value:JSON.stringify(value,null,2)));
async function run(){
  let Validator;
  try{
    const mod=await import("https://cdn.jsdelivr.net/npm/@cfworker/json-schema@4.1.1/dist/esm/index.js");
    Validator=mod.Validator;
    log("IMPORT","SUCCESS");
  }catch(e){
    log("IMPORT","FAILED");
    log("ERROR",String(e?.stack||e));
    out.textContent=lines.join("\n\n");
    return;
  }

  function testDynamic(){
    const schema={
      "$schema":"https://json-schema.org/draft/2020-12/schema",
      "$defs":{
        base:{
          "$dynamicAnchor":"node",
          "type":"string"
        },
        child:{
          "type":"object",
          "properties":{"value":{"$dynamicRef":"#node"}},
          "required":["value"],
          "additionalProperties":false
        }
      },
      "$ref":"#/$defs/child"
    };
    const data={value:123};
    try{
      const v=new Validator(schema,"2020-12");
      const r=v.validate(data);
      log("DYNAMIC_REF","data={value:123}; expected invalid; result="+JSON.stringify(r));
    }catch(e){log("DYNAMIC_REF ERROR",String(e?.stack||e))}
  }

  function testSchema(){
    const schema={
      "$schema":"https://json-schema.org/draft/07/schema#",
      "type":"string"
    };
    try{
      const v=new Validator(schema,"2020-12");
      const r=v.validate(123);
      log("$SCHEMA NON-2020-12","schema declares draft-07; validator draft=2020-12; result="+JSON.stringify(r));
    }catch(e){log("$SCHEMA NON-2020-12 ERROR",String(e?.stack||e))}
  }

  function testRemoteRef(){
    const schema={
      "$schema":"https://json-schema.org/draft/2020-12/schema",
      "$ref":"https://example.invalid/not-registered.json"
    };
    try{
      const v=new Validator(schema,"2020-12");
      const r=v.validate({});
      log("REMOTE_REF","unregistered URL; result="+JSON.stringify(r));
    }catch(e){log("REMOTE_REF ERROR",String(e?.stack||e))}
    log("NETWORK NOTE","Check browser DevTools Network if available; this page does not intercept requests.");
  }

  testDynamic();
  testSchema();
  testRemoteRef();
  log("DONE","Tests completed");
  out.textContent=lines.join("\n\n");
}
run();
</script>
</body>
</html>
